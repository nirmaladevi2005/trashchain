<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Primary Emerald Gradient -->
    <linearGradient id="tc-emerald" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Secondary Accent Teal Gradient -->
    <linearGradient id="tc-teal" x1="90" y1="10" x2="10" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Gold Recovery Accent -->
    <linearGradient id="tc-gold" x1="20" y1="80" x2="80" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Outer Interlocking Leaf-Chain Contour -->
  <path d="M 50 10 C 25 10 10 32 10 55 C 10 78 30 90 50 90 C 70 90 90 78 90 55 C 90 32 75 10 50 10 Z" 
        stroke="url(#tc-emerald)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left Interlocking Chain Loop -->
  <path d="M 36 34 C 26 40 24 56 32 66 C 40 76 54 74 60 64" 
        stroke="url(#tc-teal)" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Right Interlocking Chain Loop -->
  <path d="M 64 66 C 74 60 76 44 68 34 C 60 24 46 26 40 36" 
        stroke="url(#tc-emerald)" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Central Dynamic Leaf Vein & Recovery Node -->
  <path d="M 50 20 L 50 80 M 50 35 L 68 25 M 50 50 L 32 42 M 50 65 L 68 57" 
        stroke="url(#tc-gold)" stroke-width="5" stroke-linecap="round"/>

  <!-- Central High-Impact Recovery Link Core -->
  <circle cx="50" cy="50" r="6" fill="#10B981"/>
</svg>
